        }

            background-color: var(--canvas-bg);

            width: 100%;

<script>

    const ctx = canvas.getContext('2d');

    let currentScale = window.devicePixelRatio || 1;
    let logicalWidth = 800;
    let logicalHeight = 300;
    let isExportingEmptyGrid = false;
    let pendingTexts = [];

    // Bornes spectrales (en nm)

    const UV_MARGIN_NM = 30; // 370 à 400 nm

    const DEFAULT_STATE = {
        specWidth: 680,
        bandHeight: 65,
        showAxis: true,

        showLineValues: false,
        showProfile: false,
        printMode: false,

        tracks: [
            {

                name: "Étoile (Thermique + Abs.)",
                showName: true,
                mode: "thermal_abs", // 'thermal' | 'emission_lines' | 'absorption_lines' | 'thermal_abs'
                temp: 5800,
                showTempBadge: true,
                lines: JSON.parse(JSON.stringify(PRESETS_DB.H.lines))
            },
            {
                active: true,
                name: "Hydrogène (Réf.)",
                showName: true,
                mode: "emission_lines",
                temp: 5800,

            },
            {

                showName: true,
                mode: "thermal",
                temp: 3500,
                showTempBadge: true,
                lines: []
            },
            {
                active: false,
                name: "Sodium (Na)",
                showName: true,
                mode: "absorption_lines",
                temp: 6000,
                showTempBadge: false,
                lines: JSON.parse(JSON.stringify(PRESETS_DB.Na.lines))
            }
        ]
    };

    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    let draggedLine = null;
    let hoveredLine = null;

    // --- Conversion Longueur d'onde (nm) -> Couleur RGB ---
    function wavelengthToRGB(wavelength) {
        let r = 0, g = 0, b = 0, factor = 0;

        if (wavelength >= 380 && wavelength < 440) {
            r = -(wavelength - 440) / (440 - 380);
            g = 0.0;
            b = 1.0;
        } else if (wavelength >= 440 && wavelength < 490) {
            r = 0.0;
            g = (wavelength - 440) / (490 - 440);
            b = 1.0;
        } else if (wavelength >= 490 && wavelength < 510) {
            r = 0.0;
            g = 1.0;
            b = -(wavelength - 510) / (510 - 490);
        } else if (wavelength >= 510 && wavelength < 580) {
            r = (wavelength - 510) / (580 - 510);
            g = 1.0;
            b = 0.0;
        } else if (wavelength >= 580 && wavelength < 645) {
            r = 1.0;
            g = -(wavelength - 645) / (645 - 580);
            b = 0.0;
        } else if (wavelength >= 645 && wavelength <= 780) {
            r = 1.0;
            g = 0.0;
            b = 0.0;
        }

        // Atténuation aux bords du domaine visible (sensibilité de l'œil humain)
        if (wavelength >= 380 && wavelength < 420) {
            factor = 0.35 + 0.65 * (wavelength - 380) / (420 - 380);
        } else if (wavelength >= 420 && wavelength <= 700) {
            factor = 1.0;
        } else if (wavelength > 700 && wavelength <= 780) {
            factor = 0.35 + 0.65 * (780 - wavelength) / (780 - 700);
        } else {
            factor = 0.0;
        }

        const gamma = 0.8;
        const R = r > 0 ? Math.round(255 * Math.pow(r * factor, gamma)) : 0;
        const G = g > 0 ? Math.round(255 * Math.pow(g * factor, gamma)) : 0;
        const B = b > 0 ? Math.round(255 * Math.pow(b * factor, gamma)) : 0;

        return [R, G, B];
    }

    // --- Calcul de l'intensité thermique (Réaliste vs Exagéré) ---
    function getThermalMultiplier(lambdaNm, tempK, isExaggerated, sharpness) {
        if (lambdaNm < 380 || lambdaNm > 780) return 0;

        if (!isExaggerated) {
            // Loi de Planck normalisée sur le domaine visible pour rendu réaliste
            const c2 = 1.4388e7; // hc/k en nm.K
            const planck = (l, T) => 1.0 / (Math.pow(l, 5) * (Math.exp(c2 / (l * T)) - 1));

            // On normalise par rapport au maximum dans le visible [400..750]
            let maxVal = 0;
            for (let l = 400; l <= 750; l += 25) {
                const v = planck(l, tempK);
                if (v > maxVal) maxVal = v;
            }
            const rawRatio = maxVal > 0 ? planck(lambdaNm, tempK) / maxVal : 0;

            // Légère compression gamma + luminosité globale selon T (un corps à 2000K est plus sombre qu'à 6000K)
            const globalBrightness = Math.min(1.0, 0.55 + 0.45 * ((tempK - 1500) / 4500));
            return Math.min(1.0, Math.pow(rawRatio, 0.65) * globalBrightness);
        } else {
            // MODE EXAGÉRATION PÉDAGOGIQUE :
            // Coupure franche qui se déplace du rouge vers le violet quand T augmente.
            // - À 1800 K : seul le rouge (> 640 nm) est présent
            // - À 3000 K : rouge + orange + jaune (> 540 nm)
            // - À 4500 K : jusqu'au bleu-cyan (> 455 nm)
            // - À 6000 K et + : tout le spectre visible (jusqu'à 390 nm) est pleinement allumé
            let cutoffNm;
            if (tempK <= 6000) {
                const tNorm = Math.max(0, (tempK - 1500) / (6000 - 1500));
                // Courbe légèrement non-linéaire pour bien séparer 2000K, 3500K, 5000K, 6000K
                cutoffNm = 685 - 305 * Math.pow(tNorm, 0.85);
            } else {
                cutoffNm = 380 - (tempK - 6000) * 0.02;
            }

            // Largeur de la transition en nm selon le slider "Netteté" (sharpness de 1 à 10)
            // Sharpness 10 -> coupure quasi binaire (3 nm) ; Sharpness 1 -> transition douce (45 nm)
            const transitionWidth = Math.max(2.5, 50 - sharpness * 4.7);

            // Fonction sigmoïde centrée sur cutoffNm (passe de 0 à gauche à 1 à droite)
            const x = (lambdaNm - cutoffNm) / (transitionWidth * 0.35);
            const sigmoid = 1.0 / (1.0 + Math.exp(-x));

            // Si T > 7500 K (étoile bleue/blanche très chaude), on accentue légèrement le bleu/violet par rapport au rouge
            let hotBlueBoost = 1.0;
            if (tempK > 7000) {
                const hotFactor = Math.min(1, (tempK - 7000) / 5000);
                const redAttenuation = ((lambdaNm - 400) / 350) * 0.25 * hotFactor;
                hotBlueBoost = 1.0 - redAttenuation;
            }

            return Math.max(0, Math.min(1, sigmoid * hotBlueBoost));
        }
    }

    // --- Calcul du facteur d'absorption/émission des raies à une longueur d'onde lambda ---
    function getLinesFactor(lambdaNm, lines) {
        let total = 0;
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const dist = Math.abs(lambdaNm - line.lambda);
            const halfW = (line.w || 2.0) / 2;
            // Profil super-gaussien : cœur bien marqué et bords légèrement adoucis
            if (dist < halfW * 3.5) {
                const sigma = halfW * 0.75;
                const val = (line.intensity ?? 1.0) * Math.exp(-0.5 * Math.pow(dist / sigma, 2.4));
                total = Math.max(total, val);
            }
        }
        return Math.min(1.0, total);
    }

    // --- Géométrie du Canvas ---
    function getLayoutGeometry() {
        const activeTracks = state.tracks.map((t, idx) => ({ ...t, index: idx })).filter(t => t.active);
        const count = activeTracks.length || 1;

        const hasVisibleNames = activeTracks.some(t => t.showName && t.name.trim() !== "");
        const leftMargin = hasVisibleNames ? 165 : 35;
        const rightMargin = 35;
        const topMargin = 28;
        const bottomMargin = state.showAxis ? 52 : 25;
        const trackGap = state.showLineValues ? 32 : 22;

        const uvPx = state.showUVIR ? Math.round(state.specWidth * (UV_MARGIN_NM / (LAMBDA_MAX_VISIBLE - LAMBDA_MIN_VISIBLE))) : 0;
        const irPx = state.showUVIR ? Math.round(state.specWidth * (IR_MARGIN_NM / (LAMBDA_MAX_VISIBLE - LAMBDA_MIN_VISIBLE))) : 0;

        const totalBarWidth = uvPx + state.specWidth + irPx;
        const profileExtraH = state.showProfile ? 95 : 0;

        const totalW = leftMargin + totalBarWidth + rightMargin;
        const totalH = topMargin + count * state.bandHeight + (count - 1) * trackGap + profileExtraH + bottomMargin;

        const minNm = state.showUVIR ? (LAMBDA_MIN_VISIBLE - UV_MARGIN_NM) : LAMBDA_MIN_VISIBLE;
        const maxNm = state.showUVIR ? (LAMBDA_MAX_VISIBLE + IR_MARGIN_NM) : LAMBDA_MAX_VISIBLE;

        const nmToX = (nm) => leftMargin + ((nm - minNm) / (maxNm - minNm)) * totalBarWidth;
        const xToNm = (px) => minNm + ((px - leftMargin) / totalBarWidth) * (maxNm - minNm);

        return {
            activeTracks,
            leftMargin,
            rightMargin,
            topMargin,
            bottomMargin,
            trackGap,
            uvPx,
            irPx,
            totalBarWidth,
            profileExtraH,
            totalW,
            totalH,
            minNm,
            maxNm,
            nmToX,
            xToNm
        };
    }

    function updateCanvasDimensions() {
        const geom = getLayoutGeometry();
        logicalWidth = geom.totalW;
        logicalHeight = geom.totalH;

        canvas.style.width = logicalWidth + "px";
        canvas.style.height = logicalHeight + "px";
        canvas.width = logicalWidth * currentScale;
        canvas.height = logicalHeight * currentScale;
    }

    // --- Utilitaires de dessin ---
    function drawLine(x1, y1, x2, y2, color = "black", width = 1, dash = []) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.setLineDash(dash);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawText(text, x, y, color = "black", font = "14px Arial", align = "center", baseline = "middle", withHalo = true) {
        pendingTexts.push({ text, x, y, color, font, align, baseline, withHalo });
    }

    function flushTexts() {
        pendingTexts.forEach(t => {
            ctx.font = t.font;
            ctx.textAlign = t.align;
            ctx.textBaseline = t.baseline;
            if (t.withHalo) {
                ctx.lineJoin = "round";
                ctx.miterLimit = 2;
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
                ctx.strokeText(t.text, t.x, t.y);
            }
            ctx.fillStyle = t.color;
            ctx.fillText(t.text, t.x, t.y);
        });
        pendingTexts = [];
    }

    // --- Rendu d'une piste spectrale pixel par pixel ---
    function renderSpectrumBand(track, xStart, yStart, width, height, geom) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = Math.max(1, Math.round(width));
        offCanvas.height = 1;
        const offCtx = offCanvas.getContext('2d');
        const imgData = offCtx.createImageData(offCanvas.width, 1);
        const data = imgData.data;

        const bgByte = state.printMode ? 248 : 8; // Fond blanc cassé en mode photocopie, noir profond sinon

        for (let px = 0; px < offCanvas.width; px++) {
            const lambda = geom.minNm + (px / offCanvas.width) * (geom.maxNm - geom.minNm);
            const [baseR, baseG, baseB] = wavelengthToRGB(lambda);
            const isVisibleDomain = (lambda >= LAMBDA_MIN_VISIBLE && lambda <= LAMBDA_MAX_VISIBLE);

            let R = bgByte, G = bgByte, B = bgByte;

            if (!isVisibleDomain) {
                // Zone UV ou IR : fond grisé/noir léger
                R = state.printMode ? 238 : 18;
                G = state.printMode ? 238 : 18;
                B = state.printMode ? 238 : 18;

                // Si des raies (ex: Ca H/K à 393nm ou O2 à 760nm) tombent dans l'UV/IR proche, on les trace subtilement
                const lFactor = getLinesFactor(lambda, track.lines);
                if (lFactor > 0.05) {
                    if (track.mode === 'emission_lines') {
                        const c = state.printMode ? Math.round(238 * (1 - lFactor * 0.7)) : Math.round(18 + lFactor * 140);
                        R = c; G = Math.round(c * 0.7); B = c;
                    } else if (track.mode === 'absorption_lines' || track.mode === 'thermal_abs') {
                        const c = Math.round(R * (1 - lFactor * 0.85));
                        R = c; G = c; B = c;
                    }
                }
            } else {
                if (track.mode === 'thermal') {
                    const th = getThermalMultiplier(lambda, track.temp, state.exaggerated, state.sharpness);
                    R = Math.round(bgByte * (1 - th) + baseR * th);
                    G = Math.round(bgByte * (1 - th) + baseG * th);
                    B = Math.round(bgByte * (1 - th) + baseB * th);
                } 
                else if (track.mode === 'emission_lines') {
                    const em = getLinesFactor(lambda, track.lines);
                    // En mode photocopie sur fond blanc, si la raie est jaune/claire on renforce sa saturation
                    R = Math.round(bgByte * (1 - em) + baseR * em);
                    G = Math.round(bgByte * (1 - em) + baseG * em);
                    B = Math.round(bgByte * (1 - em) + baseB * em);
                } 
                else if (track.mode === 'absorption_lines') {
                    // Fond continu 100% + raies noires d'absorption
                    const abs = getLinesFactor(lambda, track.lines);
                    const darkR = 10, darkG = 10, darkB = 10;
                    R = Math.round(baseR * (1 - abs) + darkR * abs);
                    G = Math.round(baseG * (1 - abs) + darkG * abs);
                    B = Math.round(baseB * (1 - abs) + darkB * abs);
                } 
                else if (track.mode === 'thermal_abs') {
                    // Fond thermique à la température T puis absorption par le gaz froid au second plan
                    const th = getThermalMultiplier(lambda, track.temp, state.exaggerated, state.sharpness);
                    const thR = bgByte * (1 - th) + baseR * th;
                    const thG = bgByte * (1 - th) + baseG * th;
                    const thB = bgByte * (1 - th) + baseB * th;

                    const abs = getLinesFactor(lambda, track.lines);
                    const darkR = 8, darkG = 8, darkB = 8;
                    R = Math.round(thR * (1 - abs) + darkR * abs);
                    G = Math.round(thG * (1 - abs) + darkG * abs);
                    B = Math.round(thB * (1 - abs) + darkB * abs);
                }
            }

            const idx = px * 4;
            data[idx] = R;
            data[idx + 1] = G;
            data[idx + 2] = B;
            data[idx + 3] = 255;
        }

        offCtx.putImageData(imgData, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(offCanvas, xStart, yStart, width, height);
    }

    // --- Rendu principal ---
    function render() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(currentScale, currentScale);

        const geom = getLayoutGeometry();
        let currentY = geom.topMargin;

        geom.activeTracks.forEach((track, activeIdx) => {
            const bandX = geom.leftMargin;
            const bandY = currentY;
            const bandW = geom.totalBarWidth;
            const bandH = state.bandHeight;

            // 1. Rendu du spectre (ou rectangle blanc si export "Cadre vierge")
            if (isExportingEmptyGrid) {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(bandX, bandY, bandW, bandH);
            } else {
                renderSpectrumBand(track, bandX, bandY, bandW, bandH, geom);
            }

            // 2. Séparateurs pointillés UV / Visible / IR
            if (state.showUVIR) {
                const x400 = geom.nmToX(LAMBDA_MIN_VISIBLE);
                const x750 = geom.nmToX(LAMBDA_MAX_VISIBLE);
                const sepColor = isExportingEmptyGrid || state.printMode ? "#7f8c8d" : "rgba(255,255,255,0.65)";

                drawLine(x400, bandY, x400, bandY + bandH, sepColor, 1.5, [4, 4]);
                drawLine(x750, bandY, x750, bandY + bandH, sepColor, 1.5, [4, 4]);

                if (activeIdx === 0) {
                    drawText("UV", (bandX + x400) / 2, bandY - 11, "#7f8c8d", "bold 12px Arial", "center", "middle");
                    drawText("IR", (x750 + bandX + bandW) / 2, bandY - 11, "#7f8c8d", "bold 12px Arial", "center", "middle");
                }
            }

            // 3. Bordure du cadre spectral
            ctx.strokeStyle = "#34495e";
            ctx.lineWidth = 1.8;
            ctx.strokeRect(bandX, bandY, bandW, bandH);

            // 4. Nom de la piste à gauche + Badge de température éventuel
            if (track.showName && track.name) {
                const hasTemp = (track.mode === 'thermal' || track.mode === 'thermal_abs') && track.showTempBadge && !isExportingEmptyGrid;
                const labelY = hasTemp ? bandY + bandH / 2 - 8 : bandY + bandH / 2;
                drawText(track.name, bandX - 12, labelY, "#2c3e50", "bold 14px Arial", "right", "middle");

                if (hasTemp) {
                    drawText(`T = ${track.temp} K`, bandX - 12, bandY + bandH / 2 + 10, "#e67e22", "italic bold 12px Arial", "right", "middle");
                }
            }

            // 5. Marqueurs de raies (valeurs en nm + surbrillance au survol)
            if (!isExportingEmptyGrid && track.mode !== 'thermal') {
                track.lines.forEach((line, lIdx) => {
                    if (line.lambda < geom.minNm || line.lambda > geom.maxNm) return;
                    const lx = geom.nmToX(line.lambda);

                    const isHovered = (hoveredLine && hoveredLine.trackIndex === track.index && hoveredLine.lineIndex === lIdx) ||
                                      (draggedLine && draggedLine.trackIndex === track.index && draggedLine.lineIndex === lIdx);

                    if (isHovered) {
                        ctx.save();
                        ctx.strokeStyle = "#f1c40f";
                        ctx.lineWidth = 2;
                        ctx.setLineDash([2, 2]);
                        ctx.strokeRect(lx - Math.max(3, (line.w / 350) * state.specWidth / 2), bandY - 2, Math.max(6, (line.w / 350) * state.specWidth), bandH + 4);
                        ctx.restore();
                        drawText(`${line.lambda.toFixed(1)} nm`, lx, bandY - 10, "#d35400", "bold 11px Arial", "center", "middle");
                    } else if (state.showLineValues) {
                        const txt = line.label ? `${Math.round(line.lambda)} (${line.label})` : `${Math.round(line.lambda)}`;
                        drawText(txt, lx, bandY - 9, "#2c3e50", "10px Arial", "center", "middle");
                    }
                });
            }

            // 6. Profil spectral d'intensité I(λ) sous le Spectre 1 si activé
            if (activeIdx === 0 && state.showProfile) {
                const profY = bandY + bandH + 14;
                const profH = 72;

                // Fond du graphe
                ctx.fillStyle = "#fafbfc";
                ctx.fillRect(bandX, profY, bandW, profH);
                ctx.strokeStyle = "#bdc3c7";
                ctx.lineWidth = 1;
                ctx.strokeRect(bandX, profY, bandW, profH);

                if (geom.leftMargin > 60) {
                    drawText("Profil I(λ)", bandX - 12, profY + profH / 2, "#7f8c8d", "italic 13px Arial", "right", "middle");
                }

                if (!isExportingEmptyGrid) {
                    ctx.beginPath();
                    ctx.strokeStyle = "#e74c3c";
                    ctx.lineWidth = 2;

                    for (let px = 0; px <= bandW; px += 2) {
                        const lambda = geom.minNm + (px / bandW) * (geom.maxNm - geom.minNm);
                        let intensity = 0;

                        if (track.mode === 'thermal') {
                            intensity = getThermalMultiplier(lambda, track.temp, state.exaggerated, state.sharpness);
                        } else if (track.mode === 'emission_lines') {
                            intensity = getLinesFactor(lambda, track.lines);
                        } else if (track.mode === 'absorption_lines') {
                            intensity = (lambda >= 400 && lambda <= 750 ? 1.0 : 0.2) * (1 - getLinesFactor(lambda, track.lines));
                        } else if (track.mode === 'thermal_abs') {
                            const th = getThermalMultiplier(lambda, track.temp, state.exaggerated, state.sharpness);
                            const abs = getLinesFactor(lambda, track.lines);
                            intensity = th * (1 - abs);
                        }

                        const py = profY + profH - 6 - intensity * (profH - 12);
                        if (px === 0) ctx.moveTo(bandX + px, py);
                        else ctx.lineTo(bandX + px, py);
                    }
                    ctx.stroke();
                }

                currentY += profH + 16;
            }

            currentY += bandH + geom.trackGap;
        });

        // 7. Axe gradué des longueurs d'onde en bas
        if (state.showAxis) {
            const axisY = currentY - geom.trackGap + 8;
            const axisStartX = geom.leftMargin;
            const axisEndX = geom.leftMargin + geom.totalBarWidth;

            // Flèche de l'axe
            drawLine(axisStartX, axisY, axisEndX + 12, axisY, "#2c3e50", 1.8);
            ctx.beginPath();
            ctx.fillStyle = "#2c3e50";
            ctx.moveTo(axisEndX + 16, axisY);
            ctx.lineTo(axisEndX + 8, axisY - 4);
            ctx.lineTo(axisEndX + 8, axisY + 4);
            ctx.fill();

            drawText("λ (nm)", axisEndX + 15, axisY + 18, "#2c3e50", "bold italic 13px Arial", "center", "middle");

            // Graduations tous les 10 nm, étiquettes tous les 50 nm
            const firstTick = Math.ceil(geom.minNm / 10) * 10;
            for (let nm = firstTick; nm <= geom.maxNm; nm += 10) {
                const tx = geom.nmToX(nm);
                const isMajor = (nm % 50 === 0);
                const tickH = isMajor ? 8 : 4;

                drawLine(tx, axisY, tx, axisY + tickH, "#2c3e50", isMajor ? 1.6 : 1);
                if (isMajor) {
                    drawText(nm.toString(), tx, axisY + 19, "#2c3e50", "bold 12px Arial", "center", "middle");
                }
            }
        }

        flushTexts();
    }

    // --- Génération de l'interface des pistes (DOM) ---

        state.tracks.forEach((track, idx) => {

                    chipsHtml += `<button class="button is-tiny is-info is-light preset-btn" data-track="${idx}" data-preset="${key}" title="Charger ${PRESETS_DB[key].label}">${key}</button>`;
                });
                chipsHtml += `<button class="button is-tiny is-danger is-light clear-lines-btn" data-track="${idx}" title="Vider toutes les raies"><i class="fas fa-trash-can"></i></button>`;
                chipsHtml += `</div>`;

                // Liste des raies / bandes
                let itemsHtml = '';
                track.lines.forEach((line, lIdx) => {
                    itemsHtml += `
                        <div class="is-flex is-align-items-center mb-1" style="gap: 4px;">

                            <span class="is-size-7 has-text-grey">nm</span>

                            <span class="is-size-7 has-text-grey" title="Largeur de la raie ou bande">Δλ</span>
                            <input class="input is-small line-label" data-track="${idx}" data-line="${lIdx}" type="text" placeholder="Nom" value="${line.label || ''}" style="width: 52px;" title="Étiquette optionnelle (ex: Hα, D)">
                            <button class="button is-small is-danger is-light px-2 remove-line" data-track="${idx}" data-line="${lIdx}" title="Supprimer">
                                <span class="icon is-small"><i class="fas fa-times"></i></span>
                            </button>
                        </div>
                    `;
                });

                linesHtml = `
                    <div class="mt-2">
                        <div class="is-flex is-justify-content-space-between is-align-items-center">
                            <span class="is-size-7 has-text-weight-semibold has-text-grey-dark">Présélections (Atomes, Étoiles, Molécules) :</span>
                        </div>
                        ${chipsHtml}
                        <div class="is-flex is-justify-content-space-between is-align-items-center mt-1">
                            <span class="is-size-7 has-text-weight-semibold has-text-grey-dark">Raies / Bandes (${track.lines.length}) :</span>
                            <div class="buttons has-addons mb-0">
                                <button class="button is-small is-primary is-light py-0 px-2 add-line" data-track="${idx}" data-width="2" style="height: 22px; font-size: 0.72rem;" title="Ajouter une raie fine (atome)">
                                    + Raie fine
                                </button>
                                <button class="button is-small is-link is-light py-0 px-2 add-line" data-track="${idx}" data-width="35" style="height: 22px; font-size: 0.72rem;" title="Ajouter une bande large (molécule ou solution colorée)">
                                    + Bande large
                                </button>
                            </div>
                        </div>
                        <div class="lines-list">
                            ${itemsHtml || '<p class="is-size-7 has-text-grey-light has-text-centered py-1">Aucune raie. Cliquez sur un élément ou "+ Raie".</p>'}
                        </div>
                    </div>
                `;
            }

            const thermalHtml = isThermal ? `
                <div class="mt-2 p-2" style="background: #fff8f0; border-radius: 4px; border: 1px solid #fae5d3;">
                    <div class="is-flex is-justify-content-space-between is-align-items-center mb-1">
                        <span class="is-size-7 has-text-weight-bold" style="color: #d35400;"><i class="fas fa-temperature-high"></i> Température :</span>
                        <div class="is-flex is-align-items-center" style="gap: 4px;">
                            <input class="input is-small track-temp-num" data-track="${idx}" type="number" step="100" min="1500" max="12000" value="${track.temp}" style="width: 72px; height: 24px; text-align: right;">
                            <span class="is-size-7 has-text-weight-bold">K</span>
                        </div>
                    </div>
                    <input type="range" class="track-temp-range" data-track="${idx}" min="1500" max="12000" step="50" value="${track.temp}" style="width: 100%;">
                    <div class="is-flex is-justify-content-space-between is-align-items-center mt-1">
                        <div class="buttons are-small mb-0" style="gap: 3px;">
                            <button class="button is-white is-tiny temp-quick" data-track="${idx}" data-temp="2200" style="font-size: 0.65rem; height: 20px; padding: 0 5px;">Filament 2200K</button>
                            <button class="button is-white is-tiny temp-quick" data-track="${idx}" data-temp="3500" style="font-size: 0.65rem; height: 20px; padding: 0 5px;">Bételgeuse 3500K</button>
                            <button class="button is-white is-tiny temp-quick" data-track="${idx}" data-temp="5800" style="font-size: 0.65rem; height: 20px; padding: 0 5px;">Soleil 5800K</button>
                            <button class="button is-white is-tiny temp-quick" data-track="${idx}" data-temp="9500" style="font-size: 0.65rem; height: 20px; padding: 0 5px;">Sirius 9500K</button>
                        </div>
                        <label class="checkbox is-size-7" title="Afficher la température sous le nom du spectre">
                            <input type="checkbox" class="track-temp-badge" data-track="${idx}" ${track.showTempBadge ? 'checked' : ''}> Légende K
                        </label>
                    </div>
                </div>
            ` : '';

            const html = `
                <div class="track-control-box t${n}">
                    <div class="is-flex is-justify-content-space-between is-align-items-center mb-1">
                        <label class="checkbox is-flex is-align-items-center has-text-weight-bold is-size-6" style="gap: 6px;">
                            <input type="checkbox" class="toggle-track" data-track="${idx}" ${track.active ? 'checked' : ''}>
                            <span>Spectre ${n}</span>
                        </label>
                        <button class="button is-small is-white px-2 py-0 toggle-track-name" data-track="${idx}" style="display: ${track.active ? 'inline-flex' : 'none'}; height: 22px;" title="Afficher/Masquer le titre à gauche du spectre">
                            <span class="icon is-small"><i class="fas ${track.showName ? 'fa-eye' : 'fa-eye-slash has-text-grey-light'}"></i></span>
                        </button>
                    </div>

                    <div style="display: ${track.active ? 'block' : 'none'};">
                        <div class="control-row">
                            <label class="label" style="width: 48px;">Titre</label>
                            <input class="input is-small track-name" data-track="${idx}" type="text" value="${track.name}">

                                    <option value="thermal" ${track.mode === 'thermal' ? 'selected' : ''}>Émission thermique (Continu seul)</option>
                                    <option value="emission_lines" ${track.mode === 'emission_lines' ? 'selected' : ''}>Émission de raies / bandes (Gaz, laser...)</option>
                                    <option value="absorption_lines" ${track.mode === 'absorption_lines' ? 'selected' : ''}>Absorption sur fond blanc continu</option>
                                    <option value="thermal_abs" ${track.mode === 'thermal_abs' ? 'selected' : ''}>Thermique + Absorption (Étoile / Gaz froid)</option>
                                </select>
                            </div>
                        </div>
                        ${thermalHtml}
                        ${linesHtml}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    // --- Événements délégués du panneau de pistes ---
    const tracksContainer = document.getElementById('tracksContainer');

    tracksContainer.addEventListener('input', (e) => {
        const t = e.target;
        const tIdx = parseInt(t.dataset.track);
        const lIdx = parseInt(t.dataset.line);

        if (t.classList.contains('track-name')) {
            state.tracks[tIdx].name = t.value;
            updateCanvasDimensions();
            render();
        } else if (t.classList.contains('track-temp-range')) {
            const val = parseInt(t.value) || 5800;
            state.tracks[tIdx].temp = val;
            const numInput = tracksContainer.querySelector(`.track-temp-num[data-track="${tIdx}"]`);
            if (numInput) numInput.value = val;
            render();
        } else if (t.classList.contains('track-temp-num')) {
            const val = Math.max(1000, Math.min(20000, parseInt(t.value) || 5800));
            state.tracks[tIdx].temp = val;
            const rangeInput = tracksContainer.querySelector(`.track-temp-range[data-track="${tIdx}"]`);
            if (rangeInput) rangeInput.value = val;
            render();
        } else if (t.classList.contains('line-lambda')) {
            const val = parseFloat(t.value);
            if (!isNaN(val)) {
                state.tracks[tIdx].lines[lIdx].lambda = val;
                render();
            }
        } else if (t.classList.contains('line-width')) {
            const val = parseFloat(t.value);
            if (!isNaN(val) && val > 0) {
                state.tracks[tIdx].lines[lIdx].w = val;
                render();
            }
        } else if (t.classList.contains('line-label')) {
            state.tracks[tIdx].lines[lIdx].label = t.value;
            render();
        }
    });

    tracksContainer.addEventListener('change', (e) => {
        const t = e.target;
        const tIdx = parseInt(t.dataset.track);

        if (t.classList.contains('toggle-track')) {
            state.tracks[tIdx].active = t.checked;
            buildTracksUI();
            updateCanvasDimensions();
            render();
        } else if (t.classList.contains('track-mode')) {
            state.tracks[tIdx].mode = t.value;
            // Si on passe en mode raies et que la liste est vide, on pré-remplit avec Hydrogène
            if (t.value !== 'thermal' && state.tracks[tIdx].lines.length === 0) {
                state.tracks[tIdx].lines = JSON.parse(JSON.stringify(PRESETS_DB.H.lines));
            }
            buildTracksUI();
            updateCanvasDimensions();
            render();
        } else if (t.classList.contains('track-temp-badge')) {
            state.tracks[tIdx].showTempBadge = t.checked;
            render();
        }
    });

    tracksContainer.addEventListener('click', (e) => {
        const presetBtn = e.target.closest('.preset-btn');
        const clearBtn = e.target.closest('.clear-lines-btn');
        const addBtn = e.target.closest('.add-line');
        const removeBtn = e.target.closest('.remove-line');
        const toggleNameBtn = e.target.closest('.toggle-track-name');
        const tempQuickBtn = e.target.closest('.temp-quick');

        if (presetBtn) {
            const tIdx = parseInt(presetBtn.dataset.track);
            const key = presetBtn.dataset.preset;
            if (PRESETS_DB[key]) {
                state.tracks[tIdx].lines = JSON.parse(JSON.stringify(PRESETS_DB[key].lines));
                buildTracksUI();
                render();
            }
        } else if (clearBtn) {
            const tIdx = parseInt(clearBtn.dataset.track);
            state.tracks[tIdx].lines = [];
            buildTracksUI();
            render();
        } else if (addBtn) {
            const tIdx = parseInt(addBtn.dataset.track);
            const w = parseFloat(addBtn.dataset.width) || 2.0;
            state.tracks[tIdx].lines.push({
                lambda: 550.0,
                w: w,
                intensity: 1.0,
                label: w > 10 ? "Bande" : ""
            });
            buildTracksUI();
            render();
        } else if (removeBtn) {
            const tIdx = parseInt(removeBtn.dataset.track);
            const lIdx = parseInt(removeBtn.dataset.line);
            state.tracks[tIdx].lines.splice(lIdx, 1);
            buildTracksUI();
            render();
        } else if (toggleNameBtn) {
            const tIdx = parseInt(toggleNameBtn.dataset.track);
            state.tracks[tIdx].showName = !state.tracks[tIdx].showName;
            buildTracksUI();
            updateCanvasDimensions();
            render();
        } else if (tempQuickBtn) {
            const tIdx = parseInt(tempQuickBtn.dataset.track);
            const temp = parseInt(tempQuickBtn.dataset.temp);
            state.tracks[tIdx].temp = temp;
            buildTracksUI();
            render();
        }
    });

    // --- Événements des contrôles globaux ---
    document.getElementById('specWidthInput').addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (!isNaN(val) && val >= 300 && val <= 1400) {
            state.specWidth = val;
            updateCanvasDimensions();
            render();
        }
    });

    document.getElementById('bandHeightInput').addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (!isNaN(val) && val >= 25 && val <= 200) {
            state.bandHeight = val;
            updateCanvasDimensions();
            render();
        }
    });

    document.getElementById('toggleAxis').addEventListener('change', (e) => {
        state.showAxis = e.target.checked;
        updateCanvasDimensions();
        render();
    });

    document.getElementById('toggleUVIR').addEventListener('change', (e) => {
        state.showUVIR = e.target.checked;
        updateCanvasDimensions();
        render();
    });

    document.getElementById('toggleLineValues').addEventListener('change', (e) => {
        state.showLineValues = e.target.checked;
        updateCanvasDimensions();
        render();
    });

    document.getElementById('toggleProfile').addEventListener('change', (e) => {
        state.showProfile = e.target.checked;
        updateCanvasDimensions();
        render();
    });

    document.getElementById('togglePrintMode').addEventListener('change', (e) => {
        state.printMode = e.target.checked;
        render();
    });

    document.getElementById('toggleExaggerated').addEventListener('change', (e) => {
        state.exaggerated = e.target.checked;
        document.getElementById('sharpnessRow').style.opacity = state.exaggerated ? '1' : '0.4';
        document.getElementById('sharpnessRow').style.pointerEvents = state.exaggerated ? 'auto' : 'none';
        render();
    });

    document.getElementById('exaggerationSharpness').addEventListener('input', (e) => {
        state.sharpness = parseInt(e.target.value) || 7;
        document.getElementById('sharpnessVal').textContent = `${state.sharpness}/10`;
        render();
    });

    // --- Interaction Souris (Glisser-déposer des raies sur le canvas) ---
    function getHoveredLine(mouseX, mouseY) {
        const geom = getLayoutGeometry();
        let currentY = geom.topMargin;

        for (let aIdx = 0; aIdx < geom.activeTracks.length; aIdx++) {
            const track = geom.activeTracks[aIdx];
            const bandY = currentY;
            const bandH = state.bandHeight;

            if (track.mode !== 'thermal' && mouseY >= bandY - 5 && mouseY <= bandY + bandH + 5) {
                for (let lIdx = 0; lIdx < track.lines.length; lIdx++) {
                    const line = track.lines[lIdx];
                    const lx = geom.nmToX(line.lambda);
                    const tolPx = Math.max(6, ((line.w || 2) / 350) * state.specWidth / 2 + 4);
                    if (Math.abs(mouseX - lx) <= tolPx) {
                        return { trackIndex: track.index, lineIndex: lIdx };
                    }
                }
            }

            if (aIdx === 0 && state.showProfile) {
                currentY += 72 + 16;
            }
            currentY += bandH + geom.trackGap;
        }
        return null;
    }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (logicalWidth / rect.width);
        const mouseY = (e.clientY - rect.top) * (logicalHeight / rect.height);

        draggedLine = getHoveredLine(mouseX, mouseY);
        if (draggedLine) canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * (logicalWidth / rect.width);
        const mouseY = (e.clientY - rect.top) * (logicalHeight / rect.height);

        if (draggedLine) {
            canvas.style.cursor = 'grabbing';
            const geom = getLayoutGeometry();
            const rawNm = geom.xToNm(mouseX);
            const clampedNm = Math.max(geom.minNm, Math.min(geom.maxNm, Math.round(rawNm * 2) / 2));

            state.tracks[draggedLine.trackIndex].lines[draggedLine.lineIndex].lambda = clampedNm;

            const inputEl = document.getElementById(`lambda-input-${draggedLine.trackIndex}-${draggedLine.lineIndex}`);
            if (inputEl) inputEl.value = clampedNm;

            render();
        } else {
            const newHover = getHoveredLine(mouseX, mouseY);
            const changed = JSON.stringify(newHover) !== JSON.stringify(hoveredLine);
            hoveredLine = newHover;
            canvas.style.cursor = hoveredLine ? 'ew-resize' : 'default';
            if (changed) render();
        }
    });

    canvas.addEventListener('mouseup', () => {
        draggedLine = null;
        canvas.style.cursor = hoveredLine ? 'ew-resize' : 'default';
        render();
    });

    canvas.addEventListener('mouseleave', () => {
        draggedLine = null;
        hoveredLine = null;
        canvas.style.cursor = 'default';
        render();
    });

    // --- Fonctions d'Export HD et Réinitialisation ---
    function withHDExport(exportAction) {
        const savedScale = currentScale;
        currentScale = EXPORT_SCALE;
        updateCanvasDimensions();
        render();
        exportAction();
        currentScale = savedScale;
        updateCanvasDimensions();
        render();
    }

    function copyToClipboard(successMsg = "Spectre HD copié dans le presse-papier !") {
        let dataUrl;
        withHDExport(() => {
            dataUrl = canvas.toDataURL("image/png");
        });

        fetch(dataUrl)
            .then(res => res.blob())
            .then(blob => {
                const item = new ClipboardItem({ "image/png": blob });
                return navigator.clipboard.write([item]);
            })
            .then(() => showToast(successMsg, "is-success"))
            .catch(() => showToast("Erreur lors de la copie.", "is-danger"));
    }

    function copyEmptyGrid() {
        isExportingEmptyGrid = true;
        copyToClipboard("Cadre vierge gradué copié !");
        isExportingEmptyGrid = false;
        render();
    }

    function downloadImage() {
        withHDExport(() => {
            const link = document.createElement('a');
            link.download = 'spectre_HD.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function downloadEmptyGrid() {
        isExportingEmptyGrid = true;
        withHDExport(() => {
            const link = document.createElement('a');
            link.download = 'spectre_cadre_vierge_HD.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
        isExportingEmptyGrid = false;
        render();
    }

    function resetApplet() {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        document.getElementById('specWidthInput').value = state.specWidth;
        document.getElementById('bandHeightInput').value = state.bandHeight;
        document.getElementById('toggleAxis').checked = state.showAxis;
        document.getElementById('toggleUVIR').checked = state.showUVIR;
        document.getElementById('toggleLineValues').checked = state.showLineValues;
        document.getElementById('toggleProfile').checked = state.showProfile;
        document.getElementById('togglePrintMode').checked = state.printMode;
        document.getElementById('toggleExaggerated').checked = state.exaggerated;
        document.getElementById('exaggerationSharpness').value = state.sharpness;
        document.getElementById('sharpnessVal').textContent = `${state.sharpness}/10`;
        document.getElementById('sharpnessRow').style.opacity = '1';
        document.getElementById('sharpnessRow').style.pointerEvents = 'auto';

        buildTracksUI();
        updateCanvasDimensions();
        render();
    }

    // Initialisation au chargement
    buildTracksUI();
    updateCanvasDimensions();
    render();
</script>
</body>
</html>
