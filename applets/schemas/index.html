<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schémas de Chimie & Physique - PhyWeb</title>
    <link rel="icon" href="../../assets/favicons/phyweb.ico" />
    <link rel="stylesheet" href="../../common/bulma/bulma.min.css">
    <link rel="preload" href="../../common/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../../common/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../common/common.css">
    <link rel="stylesheet" href="style.css">

    <script>
      if (navigator.userAgent.toLowerCase().indexOf('electron') > -1)
        document.documentElement.classList.add('is-electron');
    </script>
</head>
<body>
<div id="app">
    <div id="navbar-container"></div>

    <div class="schemas-workspace">
        <!-- Zone supérieure : Toolbar gauche + Canvas central + Propriétés droite -->
        <div class="schemas-main">

            <!-- TOOLBAR VERTICALE GAUCHE -->
            <aside class="schemas-toolbar" aria-label="Outils de dessin">
                <div class="toolbar-group">
                    <button class="tool-btn is-active" data-tool="select" title="Sélectionner / Déplacer (V)">
                        <i class="fas fa-arrow-pointer"></i>
                    </button>
                    <button class="tool-btn" data-tool="pan" title="Déplacer la vue / Main (H)">
                        <i class="fas fa-hand"></i>
                    </button>
                    <button class="tool-btn" data-tool="wire" title="Tracer un fil électrique (W)">
                        <i class="fas fa-bolt"></i>
                    </button>
                    <button class="tool-btn" data-tool="hose" title="Tracer un tuyau de chimie (T)">
                        <i class="fas fa-water"></i>
                    </button>
                    <button class="tool-btn" data-tool="label" title="Ajouter une légende avec flèche (L)">
                        <i class="fas fa-font"></i>
                    </button>
                    <button class="tool-btn" id="btnOpenShapes" title="Formes & Flèches (ouvrir dans la banque)">
                        <i class="fas fa-shapes"></i>
                    </button>
                    <button class="tool-btn" id="btnOpenTemplates" title="Modèles de montages préconstruits">
                        <i class="fas fa-wand-magic-sparkles"></i>
                    </button>
                </div>

                <div class="toolbar-divider"></div>

                <div class="toolbar-group">
                    <button class="tool-btn" id="btnUndo" title="Annuler (Ctrl+Z)" disabled>
                        <i class="fas fa-rotate-left"></i>
                    </button>
                    <button class="tool-btn" id="btnRedo" title="Rétablir (Ctrl+Y)" disabled>
                        <i class="fas fa-rotate-right"></i>
                    </button>
                </div>

                <div class="toolbar-divider"></div>

                <div class="toolbar-group">
                    <button class="tool-btn is-toggled" id="btnToggleSnap" title="Aimantation (M)">
                        <i class="fas fa-magnet"></i>
                    </button>
                    <button class="tool-btn is-toggled" id="btnToggleGrid" title="Afficher la grille (G)">
                        <i class="fas fa-border-all"></i>
                    </button>
                    <button class="tool-btn" id="btnAddTable" title="Ajouter / Sélectionner une table (paillasse) en bas">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="2" y="6" width="20" height="4" rx="1" />
                            <line x1="5" y1="10" x2="5" y2="20" />
                            <line x1="19" y1="10" x2="19" y2="20" />
                        </svg>
                    </button>
                    <button class="tool-btn" id="btnZoomIn" title="Zoomer (+)">
                        <i class="fas fa-magnifying-glass-plus"></i>
                    </button>
                    <button class="tool-btn" id="btnZoomOut" title="Dézoomer (-)">
                        <i class="fas fa-magnifying-glass-minus"></i>
                    </button>
                    <button class="tool-btn" id="btnZoomFit" title="Centrer / Adapter la vue">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>

                <div class="toolbar-group toolbar-bottom">
                    <button class="tool-btn is-danger-hover" id="btnClearScene" title="Effacer tout le schéma">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </div>
                <input type="file" id="jsonFileInput" accept=".pws,.json,application/json" style="display:none">
            </aside>

            <!-- ZONE DE DESSIN CENTRALE -->
            <main class="schemas-stage" id="stageContainer">
                <svg id="sceneSvg" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="gridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
                            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9eef5" stroke-width="0.8" />
                        </pattern>
                        <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
                            <rect width="100" height="100" fill="url(#gridMinor)" />
                            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5dde8" stroke-width="1.2" />
                        </pattern>
                    </defs>
                    <g id="viewportGroup">
                        <rect id="gridRect" x="-5000" y="-5000" width="10000" height="10000" fill="url(#gridMajor)" />
                        <g id="layerConnectorsBack"></g>
                        <g id="layerItems"></g>
                        <g id="layerConnectors"></g>
                        <g id="layerLabels"></g>
                        <g id="layerOverlay"></g>
                    </g>
                </svg>

                <!-- Badges d'état flottants -->
                <div class="stage-status-bar">
                    <span class="stage-pill" id="toolHint">Sélection · Glissez pour déplacer</span>
                    <span class="stage-pill" id="zoomBadge">100%</span>
                </div>

                <!-- Raccourcis d'export rapides en haut à droite du canvas -->
                <div class="stage-export-bar">
                    <button class="button is-small is-info is-light is-rounded" id="btnQuickCopy" title="Copier l'image HD">
                        <span class="icon is-small"><i class="fas fa-copy"></i></span><span>Copier</span>
                    </button>
                    <button class="button is-small is-success is-rounded" id="btnQuickPNG" title="Télécharger PNG HD">
                        <span class="icon is-small"><i class="fas fa-download"></i></span><span>PNG</span>
                    </button>
                    <button class="button is-small is-link is-light is-rounded" id="btnQuickSVG" title="Télécharger SVG">
                        <span class="icon is-small"><i class="fas fa-code"></i></span><span>SVG</span>
                    </button>
                </div>
            </main>

            <!-- PANNEAU DE PROPRIÉTÉS À DROITE -->
            <aside class="schemas-inspector" id="inspectorPanel">
                <div class="inspector-header">
                    <span class="inspector-title" id="inspectorTitle">
                        <i class="fas fa-sliders mr-1"></i> Propriétés
                    </span>
                    <button type="button" class="inspector-toggle-btn" id="btnToggleInspector" title="Replier / Déplier les propriétés (I)" aria-label="Replier / Déplier les propriétés" aria-expanded="true">
                        <i class="fas fa-chevron-right" id="inspectorToggleIcon"></i>
                    </button>
                </div>
                <div class="inspector-body" id="inspectorBody"></div>
            </aside>

        </div>

        <!-- DRAWER EN BAS DE L'ÉCRAN (BANQUE D'OBJETS) -->
        <section class="schemas-drawer" id="objectDrawer">
            <div class="drawer-delete-overlay" aria-hidden="true">
                <i class="fas fa-trash-can"></i>
                <span>Relâcher ici pour supprimer</span>
            </div>
            <div class="drawer-header">
                <button class="drawer-toggle-btn" id="btnToggleDrawer" title="Replier / Déplier la banque d'objets">
                    <i class="fas fa-chevron-down" id="drawerToggleIcon"></i>
                    <span>Banque d'objets</span>
                </button>

                <div class="drawer-tabs" id="drawerTabs"></div>

                <div class="drawer-search">
                    <span class="icon is-small"><i class="fas fa-search"></i></span>
                    <input type="text" id="drawerSearchInput" placeholder="Rechercher (bécher, ballon, multimètre...)" autocomplete="off">
                    <button type="button" class="drawer-search-clear" id="btnClearSearch" title="Effacer la recherche" aria-label="Effacer la recherche" hidden>
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="drawer-grid" id="drawerGrid"></div>
        </section>
    </div>
</div>

<!-- MODALE D'EXPORT AVANCÉ & IMPRESSION / PDF (style Grapher) -->
<div id="export-modal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-card" style="width: 82vw; max-width: 1180px; height: 82vh; min-height: 600px;">
        <header class="modal-card-head" style="padding: 16px 20px;">
            <p class="modal-card-title is-size-5 has-text-weight-bold">
                <i class="fas fa-print mr-2"></i>Exporter / Imprimer
            </p>
            <button type="button" class="delete" id="export-close-x" aria-label="Fermer"></button>
        </header>

        <section class="modal-card-body pb-3 is-flex is-flex-direction-column" style="overflow: hidden;">
            <div class="columns is-flex-grow-1 mb-0" style="min-height: 0;">
                <!-- COLONNE GAUCHE : Options -->
                <div class="column is-4" style="overflow-y: auto;">
                    <div class="field">
                        <label class="label is-small" for="export-action-select">Action souhaitée</label>
                        <div class="control">
                            <div class="select is-small is-fullwidth">
                                <select id="export-action-select">
                                    <option value="image" selected>Image (PNG / JPEG / SVG)</option>
                                    <option value="print">Document (Impression / PDF)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Options pour PDF / Impression -->
                    <div id="export-print-options" class="box p-3 mt-3">
                        <div class="field">
                            <label class="label is-small" for="export-title-input">Titre du document (optionnel)</label>
                            <div class="control">
                                <input class="input is-small" type="text" id="export-title-input" placeholder="Ex : Montage à reflux">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label is-small" for="export-orientation-select">Orientation (A4)</label>
                            <div class="control">
                                <div class="select is-small is-fullwidth">
                                    <select id="export-orientation-select" class="export-trigger">
                                        <option value="portrait" selected>Portrait</option>
                                        <option value="landscape">Paysage</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field mb-0">
                            <label class="label is-small" for="export-margin-select">Marges de page</label>
                            <div class="control">
                                <div class="select is-small is-fullwidth">
                                    <select id="export-margin-select" class="export-trigger">
                                        <option value="1cm">Étroites (1 cm)</option>
                                        <option value="1.5cm" selected>Normales (1,5 cm)</option>
                                        <option value="2.5cm">Larges (2,5 cm)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Options pour Image -->
                    <div id="export-image-options" class="box p-3 mt-3 is-hidden">
                        <div class="field">
                            <label class="label is-small" for="export-image-format">Format</label>
                            <div class="control">
                                <div class="select is-small is-fullwidth">
                                    <select id="export-image-format" class="export-trigger">
                                        <option value="image/png" selected>PNG (sans perte)</option>
                                        <option value="image/jpeg">JPEG (fond blanc)</option>
                                        <option value="image/svg+xml">SVG (vectoriel)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field" id="export-scale-field">
                            <label class="label is-small" for="export-image-scale">Résolution</label>
                            <div class="control">
                                <div class="select is-small is-fullwidth">
                                    <select id="export-image-scale" class="export-trigger">
                                        <option value="1">×1 (Standard)</option>
                                        <option value="2">×2 (HD)</option>
                                        <option value="3" selected>×3 (Très HD)</option>
                                        <option value="4">×4 (Ultra HD)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label is-small" for="export-padding-select">Marge autour du schéma</label>
                            <div class="control">
                                <div class="select is-small is-fullwidth">
                                    <select id="export-padding-select" class="export-trigger">
                                        <option value="0">Aucune (0 px)</option>
                                        <option value="16">Fine (16 px)</option>
                                        <option value="36" selected>Normale (36 px)</option>
                                        <option value="64">Large (64 px)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field" id="export-transparent-field">
                            <label class="checkbox is-size-7 has-text-weight-semibold">
                                <input type="checkbox" id="export-transparent-check" class="export-trigger">
                                Fond transparent
                            </label>
                        </div>

                        <p class="is-size-7 has-text-grey mt-2" id="export-dims-info"></p>
                    </div>
                </div>

                <!-- COLONNE DROITE : Aperçu en temps réel -->
                <div class="column is-8 is-flex is-flex-direction-column" style="overflow: hidden; min-height: 0;">
                    <h3 class="title is-6 mb-2" id="export-preview-heading">Aperçu du document</h3>
                    <div class="box is-flex-grow-1 p-0 is-flex is-flex-direction-column" style="overflow: hidden; min-height: 0;">
                        <iframe id="export-preview-iframe" title="Aperçu de l'export" style="width: 100%; flex-grow: 1; border: none; height: 100%;"></iframe>
                    </div>
                </div>
            </div>
        </section>

        <footer class="modal-card-foot" style="padding: 12px 20px;">
            <div class="buttons">
                <button type="button" class="button is-success" id="export-confirm-button">
                    <span class="icon is-small"><i class="fas fa-print"></i></span>
                    <span>Imprimer / Exporter en PDF</span>
                </button>
                <button type="button" class="button is-info is-hidden" id="export-copy-button">
                    <span class="icon is-small"><i class="fas fa-copy"></i></span>
                    <span>Copier l'image</span>
                </button>
                <button type="button" class="button" id="export-cancel-button">Annuler</button>
            </div>
        </footer>
    </div>
</div>

<!-- MODALE DES MODÈLES DE MONTAGES PRÉCONSTRUITS -->
<div id="templates-modal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-card" style="width: 82vw; max-width: 1020px; max-height: 84vh;">
        <header class="modal-card-head" style="padding: 16px 20px;">
            <p class="modal-card-title is-size-5 has-text-weight-bold">
                <i class="fas fa-wand-magic-sparkles mr-2"></i>Modèles de montages
            </p>
            <button type="button" class="delete" id="templates-close-x" aria-label="Fermer"></button>
        </header>
        <section class="modal-card-body">
            <p class="is-size-7 has-text-grey mb-3">Choisissez un montage classique pour démarrer rapidement, puis modifiez-le librement sur le schéma.</p>
            <div class="templates-grid" id="templatesGrid"></div>
        </section>
        <footer class="modal-card-foot" style="padding: 12px 20px;">
            <button type="button" class="button" id="templates-cancel-button">Fermer</button>
        </footer>
    </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
